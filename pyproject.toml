[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wget2"
version = "2.0.0"
description = "Multi-connection HTTP/HTTPS downloader with pluggable backends, resume, retries and checksums"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wget2 contributors" }]
keywords = ["download", "http", "cli", "resume", "parallel", "wget"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
pycurl = ["pycurl>=7.44"]
httpx = ["httpx[http2]>=0.27"]
requests = ["requests>=2.28"]
yaml = ["PyYAML>=6"]
all = ["wget2[pycurl,httpx,requests,yaml]"]
dev = [
  "wget2[all]",
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-requests",
]

[project.scripts]
wget2 = "wget2.cli:cli"

[project.urls]
Homepage = "https://example.invalid/wget2"
Documentation = "https://example.invalid/wget2/docs"

# Third-party backends register themselves under this group, e.g.
#   [project.entry-points."wget2.backends"]
#   mybackend = "mypkg.backend:MyBackend"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wget2*"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "PL"]
ignore = [
  "PLR0913", # too many arguments (CLI surface)
  "PLR0915", # too many statements
  "PLR0912", # too many branches
  "PLR0917", # too many positional arguments
  "PLR0911", # many returns (dispatch-style code)
  "PLR2004", # magic value comparisons
  "PLW2901", # loop variable overwritten
  "B008",    # typer.Option in defaults is idiomatic
  "N818",    # exception names
  "SIM105",  # contextlib.suppress is not always clearer here
  "PLC0415", # lazy imports keep optional backends optional
  "UP045",   # Optional[...] is what Typer understands best
  "UP035",   # typing.Optional/List imports are still required by Typer
  "ARG001",  # unused args are often interface-mandated (backends, sinks)
  "ARG002",  # same
  "ARG005",  # same (lambdas passed as sinks)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0915", "ARG001", "ARG002", "S101", "B017"]
"wget2/backends/pycurl_backend.py" = ["N806"]
# Typer option declarations are one-per-line by design
"wget2/cli.py" = ["E501"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that wait on real time",
  "network: tests needing a local HTTP server",
]
filterwarnings = ["error::DeprecationWarning:wget2.*"]

[tool.coverage.run]
branch = true
source = ["wget2"]
omit = ["wget2/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
