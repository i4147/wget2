[options]
package_dir =
    = src
packages = find:
python_requires = >= 3.12
install_requires =
    typer
    rich
    loguru
    python-dotenv

[options.packages.find]
where = src

[options.package_data]
* = py.typed

[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
files = src

[ruff]
line-length = 88
target-version = py312

[tool:pytest]
testpaths = tests
addopts = -ra -q
